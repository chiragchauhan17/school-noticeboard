<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board Display</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        background: #000; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 100%; height: 100%; overflow: hidden;
    }

    /* Overscan guard. Some TVs crop the outer few percent of the
       panel. Add ?overscan=3 to the URL on any box that needs it. */
    #stage {
        position: absolute; inset: 0;
        padding: var(--overscan, 0);
        background: #000;
    }

    .slide {
        position: absolute; inset: var(--overscan, 0);
        opacity: 0; transition: opacity 1.2s ease-in-out;
        display: flex; align-items: center; justify-content: center;
        background-size: contain; background-position: center; background-repeat: no-repeat;
    }
    .slide.active { opacity: 1; }

    .notice-card {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        padding: 4rem; border-radius: 2rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        text-align: center; width: 85%; max-width: 1400px;
        max-height: 90%; overflow: hidden;
    }
    .notice-card h1 { font-size: 4.5rem; margin-bottom: 1.5rem; color: #ffdd00; }
    .notice-card p, .notice-card div { font-size: 2.8rem; line-height: 1.4; }
    .notice-card table { margin: 0 auto; font-size: 2rem; border-collapse: collapse; }
    .notice-card td, .notice-card th { padding: 0.5rem 1.5rem; border: 1px solid rgba(255,255,255,0.3); }

    .standby { flex-direction: column; text-align: center; }
    .standby h1 { font-size: 4.5rem; color: #3b82f6; margin-bottom: 1rem; }
    .standby p { font-size: 1.8rem; color: #64748b; }

    video.slide-video { width: 100%; height: 100%; object-fit: contain; }

    /* Only visible when we are showing cached content because the
       network is down. Staff need to be able to tell stale from live. */
    #offline-badge {
        position: absolute; bottom: 1.5rem; right: 2rem;
        background: rgba(0,0,0,0.75); color: #fbbf24;
        padding: 0.5rem 1.1rem; border-radius: 0.6rem;
        font-size: 1.05rem; letter-spacing: 0.02em;
        border: 1px solid rgba(251,191,36,0.35);
        opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
    }
    #offline-badge.show { opacity: 1; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="offline-badge"></div>

<script>
(function () {
    'use strict';

    var POLL_MS = 5000;          // how often we ask the server for changes
    var OFFLINE_AFTER = 3;       // consecutive failures before showing the badge
    var CACHE_KEY = 'nb:notices';
    var CACHE_TIME_KEY = 'nb:notices:at';

    var stage = document.getElementById('stage');
    var badge = document.getElementById('offline-badge');

    var notices = [];
    var index = 0;
    var timer = null;
    var failures = 0;
    var lastGoodAt = null;

    /* ---------- URL options ---------------------------------------- */

    var params = new URLSearchParams(location.search);

    var overscan = parseFloat(params.get('overscan'));
    if (overscan > 0 && overscan <= 10) {
        document.documentElement.style.setProperty('--overscan', overscan + '%');
    }

    // The Android app appends ?device=<id>. Falls back to a locally
    // generated id so the page also works in a plain browser.
    var deviceId = params.get('device');
    if (!deviceId) {
        try {
            deviceId = localStorage.getItem('nb:device');
            if (!deviceId) {
                deviceId = 'web-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('nb:device', deviceId);
            }
        } catch (e) { deviceId = ''; }
    }

    /* ---------- rendering ------------------------------------------ */

    function standby() {
        stage.innerHTML =
            '<div class="slide standby active">' +
            '<h1>School Digital Notice Board</h1>' +
            '<p>Waiting for notices\u2026</p>' +
            '</div>';
    }

    function buildSlide(item) {
        var slide = document.createElement('div');
        slide.className = 'slide';

        if (item.type === 'image') {
            slide.style.backgroundImage = "url('" + item.url + "')";
        } else if (item.type === 'video') {
            var video = document.createElement('video');
            video.className = 'slide-video';
            video.src = item.url;
            video.autoplay = true;
            video.muted = true;              // corridors stay quiet
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            slide.appendChild(video);
        } else {
            slide.innerHTML = '<div class="notice-card"><h1>Announcement</h1><div>' +
                item.content + '</div></div>';
        }
        return slide;
    }

    function show() {
        if (!notices.length) { standby(); return; }
        if (index >= notices.length) index = 0;

        var item = notices[index];
        var slide = buildSlide(item);
        stage.appendChild(slide);

        // Force a reflow so the opacity transition actually runs.
        void slide.offsetWidth;
        slide.classList.add('active');

        // Drop every earlier slide once the crossfade has finished.
        var stale = [];
        for (var i = 0; i < stage.children.length; i++) {
            if (stage.children[i] !== slide) stale.push(stage.children[i]);
        }
        setTimeout(function () {
            stale.forEach(function (el) {
                var v = el.querySelector && el.querySelector('video');
                if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
                if (el.parentNode) el.parentNode.removeChild(el);
            });
        }, 1400);

        clearTimeout(timer);

        // A single still image needs no timer at all — it just sits
        // there until the notices change.
        if (notices.length === 1 && item.type !== 'video') return;

        var wait = item.duration || 10000;

        if (item.type === 'video') {
            var video = slide.querySelector('video');
            var advanced = false;
            var next = function () {
                if (advanced) return;
                advanced = true;
                index = notices.length === 1 ? 0 : index + 1;
                show();
            };
            video.onended = next;
            video.onerror = next;
            // Backstop in case the video never fires 'ended'.
            timer = setTimeout(next, wait + 5000);
        } else {
            timer = setTimeout(function () { index++; show(); }, wait);
        }
    }

    function sameList(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
    }

    function apply(list, restart) {
        if (sameList(notices, list)) return;
        notices = list;
        if (restart || index >= notices.length) index = 0;
        clearTimeout(timer);
        show();
    }

    /* ---------- offline badge -------------------------------------- */

    function updateBadge() {
        if (failures >= OFFLINE_AFTER && lastGoodAt) {
            var d = new Date(lastGoodAt);
            var hh = String(d.getHours()).padStart(2, '0');
            var mm = String(d.getMinutes()).padStart(2, '0');
            badge.textContent = 'Offline \u2014 last updated ' + hh + ':' + mm;
            badge.classList.add('show');
        } else {
            badge.classList.remove('show');
        }
    }

    /* ---------- polling -------------------------------------------- */

    function poll() {
        var url = '/api/notices' + (deviceId ? '?device=' + encodeURIComponent(deviceId) : '');

        fetch(url, { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (data) {
                if (!Array.isArray(data)) throw new Error('bad payload');
                failures = 0;
                lastGoodAt = Date.now();
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY, String(lastGoodAt));
                } catch (e) {}
                updateBadge();
                apply(data, false);
            })
            .catch(function () {
                // Deliberately silent. The current slide stays on screen
                // and we simply try again — no error page, no reload.
                failures++;
                updateBadge();
            })
            .then(function () {
                setTimeout(poll, POLL_MS);
            });
    }

    /* ---------- boot ------------------------------------------------ */

    // Paint something immediately, before any network call, so a cold
    // boot during a power cut is never a black screen.
    standby();

    try {
        var cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            var list = JSON.parse(cached);
            if (Array.isArray(list) && list.length) {
                lastGoodAt = Number(localStorage.getItem(CACHE_TIME_KEY)) || null;
                failures = OFFLINE_AFTER; // assume stale until a fetch succeeds
                updateBadge();
                apply(list, true);
            }
        }
    } catch (e) {}

    poll();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
})();
</script>
</body>
</html>
