<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Board - Staff Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; padding: 24px; color: #1c1e21; }
        .container { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 24px; text-align: center; }
        h1 { color: #1877f2; font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: #65676b; }
        .card { background: #ffffff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 1.25rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
        input[type="file"], input[type="number"], textarea, select {
            width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 1rem;
        }
        textarea { resize: vertical; min-height: 120px; }
        .btn {
            background: #1877f2; color: #ffffff; border: none; padding: 12px 24px;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            width: 100%; transition: background 0.2s;
        }
        .btn:hover { background: #166fe5; }
        .btn-danger { background: #e41e3f; }
        .btn-danger:hover { background: #c81734; }
        .active-list { list-style: none; margin-top: 12px; }
        .active-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f0f2f5; font-size: 0.95rem; }
        .preview-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        .badge-image { background: #e7f3ff; color: #1877f2; }
        .badge-video { background: #fdf0d5; color: #c27803; }
        .badge-html { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>School Notice Board Admin</h1>
            <p class="subtitle">Upload content to automatically broadcast to all connected TVs</p>
        </header>

        <!-- Form 1: Image or Video Upload -->
        <div class="card">
            <h2>📷 Upload Image or Video</h2>
            <form action="/api/notices/media" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="mediaFile">Select Image or MP4 Video File:</label>
                    <input type="file" id="mediaFile" name="mediaFile" accept="image/*,video/mp4" required>
                </div>
                <div class="form-group">
                    <label for="mediaDuration">Display Duration (Seconds):</label>
                    <input type="number" id="mediaDuration" name="duration" value="15" min="3" max="300" required>
                </div>
                <button type="submit" class="btn">Upload to Notice Board</button>
            </form>
        </div>

        <!-- Form 2: Text / Table Notice -->
        <div class="card">
            <h2>📝 Add Text Notice or Announcement</h2>
            <form action="/api/notices/text" method="POST">
                <div class="form-group">
                    <label for="content">Notice Message (Supports plain text or HTML formatting/tables):</label>
                    <textarea id="content" name="content" placeholder="E.g., Robotics Exhibition on Floor 2 at 11:00 AM." required></textarea>
                </div>
                <div class="form-group">
                    <label for="textDuration">Display Duration (Seconds):</label>
                    <input type="number" id="textDuration" name="duration" value="12" min="3" max="300" required>
                </div>
                <button type="submit" class="btn">Publish Text Notice</button>
            </form>
        </div>

        <!-- Clear Board -->
        <div class="card">
            <h2>🗑️ Active Notices Management</h2>
            <div id="noticeListContainer">Loading active notices...</div>
            <form action="/api/notices/clear" method="POST" style="margin-top: 16px;" onsubmit="return confirm('Are you sure you want to clear all notices from all TVs?');">
                <button type="submit" class="btn btn-danger">Clear All Notices</button>
            </form>
        </div>
    </div>

    <script>
        // Fetch and display active notices on panel load
        fetch('/api/notices')
            .then(res => res.json())
            .then(notices => {
                const container = document.getElementById('noticeListContainer');
                if (!notices || notices.length === 0) {
                    container.innerHTML = '<p style="color: #65676b;">No notices currently active. The TVs will show the default standby screen.</p>';
                    return;
                }
                let html = '<ul class="active-list">';
                notices.forEach((n, i) => {
                    const badgeClass = n.type === 'video' ? 'badge-video' : (n.type === 'image' ? 'badge-image' : 'badge-html');
                    const desc = n.type === 'html' ? n.content.substring(0, 45) + '...' : n.url;
                    html += `
                        <li class="active-item">
                            <div>
                                <span class="preview-badge ${badgeClass}">${n.type}</span>
                                <strong>#${i + 1}</strong>: ${desc}
                            </div>
                            <span style="color: #65676b;">${n.duration / 1000}s</span>
                        </li>`;
                });
                html += '</ul>';
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('noticeListContainer').innerHTML = '<p style="color: #e41e3f;">Failed to load active notices.</p>';
            });
    </script>
</body>
</html>
